[package]
name = "message_of_day"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/message-core",
]

[dependencies]
message-core = { path = "crates/message-core" }
anyhow = "1.0.104"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = "0.9.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
