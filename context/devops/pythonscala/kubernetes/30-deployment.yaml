apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-scala
  namespace: django-scala-local
  labels:
    app.kubernetes.io/name: django-scala
    app.kubernetes.io/part-of: django-scala-example
spec:
  # Each Pod contains a scheduler. Keep a single replica.
  replicas: 1

  # Avoids two schedulers during a normal rollout.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: django-scala

  template:
    metadata:
      labels:
        app.kubernetes.io/name: django-scala
        app.kubernetes.io/part-of: django-scala-example

    spec:
      terminationGracePeriodSeconds: 45

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: django
          image: django-scala/django:dev
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: django-scala-config
            - secretRef:
                name: django-scala-secrets

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOME
              value: /tmp

          startupProbe:
            httpGet:
              path: /health/live/
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health/ready/
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live/
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: django-tmp
              mountPath: /tmp

        - name: scala-cron
          image: django-scala/scala-cron:dev
          imagePullPolicy: Never

          envFrom:
            - configMapRef:
                name: django-scala-config
            - secretRef:
                name: django-scala-secrets

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOME
              value: /tmp
            - name: CRONTAB_FILE
              value: /etc/supercronic/crontab

          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: scala-crontab
              mountPath: /etc/supercronic
              readOnly: true
            - name: scala-tmp
              mountPath: /tmp

      volumes:
        - name: scala-crontab
          configMap:
            name: scala-crontab
            defaultMode: 0444
            items:
              - key: crontab
                path: crontab

        - name: django-tmp
          emptyDir:
            sizeLimit: 128Mi

        - name: scala-tmp
          emptyDir:
            sizeLimit: 128Mi
