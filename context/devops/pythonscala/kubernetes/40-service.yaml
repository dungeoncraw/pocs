apiVersion: v1
kind: Service
metadata:
  name: django
  namespace: django-scala-local
  labels:
    app.kubernetes.io/name: django-scala
spec:
  type: NodePort

  selector:
    app.kubernetes.io/name: django-scala

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 30080
