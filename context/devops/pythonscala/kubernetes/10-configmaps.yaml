apiVersion: v1
kind: ConfigMap
metadata:
  name: django-scala-config
  namespace: django-scala-local
data:
  DJANGO_DEBUG: "false"
  ALLOWED_HOSTS: "*"
  SQLITE_PATH: "/tmp/db.sqlite3"
  TZ: "America/Sao_Paulo"

  CSV_PATH: "/data/records.csv"
  CSV_LOCK_PATH: "/data/records.lock"

  SCALA_HOST: "0.0.0.0"
  SCALA_PORT: "9000"

  RUN_ON_START: "true"
  JAVA_OPTS: >-
    --add-modules=jdk.httpserver
    -XX:MaxRAMPercentage=75.0
    -XX:+ExitOnOutOfMemoryError
    -Dfile.encoding=UTF-8

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scala-crontab
  namespace: django-scala-local
data:
  crontab: |
    CRON_TZ=America/Sao_Paulo

    # Runs at minutes 00, 10, 20, 30, 40, and 50.
    */10 * * * * /opt/scala-job/run-job.sh
